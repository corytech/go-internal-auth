name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-dot-env-comments:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scope:
          - .env.dist
          - service/.env
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: corytech/check-dot-env-comments@v0.1.1
        with:
          file-path: '${{ matrix.scope }}'

  check-build-is-ok:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            runner: hetzner-arm64
          - platform: linux/amd64
            runner: hetzner-arc
    runs-on:
      labels:
        - ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Setup Builder
        uses: docker/setup-buildx-action@v4.1.0

      - name: Try to Build
        uses: docker/build-push-action@v7.2.0
        with:
          file: ./docker/service/Dockerfile
          context: .
          push: false
          provenance: false
          build-args: |
            VERSION=0.0.0
          no-cache: true

  check-if-all-the-test-passed:
    runs-on: ubuntu-latest
    needs:
      - check-dot-env-comments
      - check-build-is-ok
    steps:
      - name: test suite success
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: test suite failures
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1